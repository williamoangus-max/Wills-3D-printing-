<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1f3a">
<title>Support 886 Squadron</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(145deg,#07182d,#123d69);color:#102033}.card{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:30px 24px 24px;box-shadow:0 18px 60px rgba(0,0,0,.28);text-align:center}.logo{width:82px;height:82px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#0b1f3a;color:#fff;font-weight:800;font-size:15px;line-height:1.15;letter-spacing:.5px}.logo::first-line{font-size:17px}h1{margin:0 0 10px;font-size:28px;line-height:1.15}.description{margin:0 auto 26px;max-width:350px;color:#626d78;font-size:15px;line-height:1.55}.amount-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.amount-button,.custom-button,.donate-button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.amount-button{padding:16px 8px;border:2px solid #e1e7ed;border-radius:14px;background:#f4f7fa;color:#0b1f3a;font-size:19px;font-weight:750;transition:.15s}.amount-button:hover,.custom-button:hover{border-color:#0b1f3a}.amount-button.selected{background:#0b1f3a;border-color:#0b1f3a;color:#fff}.custom-button{width:100%;padding:15px;border:2px solid #e1e7ed;border-radius:14px;background:#fff;color:#0b1f3a;font-size:17px;font-weight:700;margin-bottom:16px}.donate-button{width:100%;padding:17px;border:0;border-radius:15px;background:#0b1f3a;color:#fff;font-size:18px;font-weight:800;transition:.15s}.donate-button:hover:not(:disabled){background:#15355a;transform:translateY(-1px)}.donate-button:disabled{opacity:.45;cursor:not-allowed}.secure{margin:18px 0 0;color:#596572;font-size:13px}.footer{margin-top:18px;color:#8a949e;font-size:11px;line-height:1.45}@media(max-width:360px){.card{padding:25px 18px 20px}h1{font-size:25px}}
</style>
</head>
<body>
<main class="card">
<div class="logo">886<br>SQUADRON</div>
<h1>Support 886 Squadron</h1>
<p class="description">Your donation helps support the activities, training and opportunities provided by our Air Training Corps squadron.</p>
<div class="amount-grid">
<button class="amount-button" data-amount="1">£1</button>
<button class="amount-button" data-amount="5">£5</button>
<button class="amount-button" data-amount="10">£10</button>
</div>
<button id="customButton" class="custom-button">Custom amount</button>
<button id="donateButton" class="donate-button" disabled>Choose an amount</button>
<p class="secure">🔒 Secure payment through Stripe</p>
<p class="footer">Apple Pay may be available on compatible devices.</p>
</main>
<script>
/* Replace these four URLs with the squadron's Stripe Payment Links. */
const STRIPE_LINKS={
  "1":"PASTE_STRIPE_1_POUND_LINK_HERE",
  "5":"PASTE_STRIPE_5_POUND_LINK_HERE",
  "10":"PASTE_STRIPE_10_POUND_LINK_HERE",
  "custom":"PASTE_STRIPE_CUSTOM_AMOUNT_LINK_HERE"
};
const amountButtons=document.querySelectorAll('.amount-button');
const customButton=document.getElementById('customButton');
const donateButton=document.getElementById('donateButton');
let selectedAmount=null;
function selectAmount(amount){
  selectedAmount=amount;
  amountButtons.forEach(b=>b.classList.toggle('selected',b.dataset.amount===amount));
  donateButton.disabled=false;
  donateButton.textContent=`Donate £${Number(amount).toFixed(2)}`;
}
amountButtons.forEach(button=>button.addEventListener('click',()=>selectAmount(button.dataset.amount)));
customButton.addEventListener('click',()=>{
  amountButtons.forEach(b=>b.classList.remove('selected'));
  selectedAmount='custom';
  donateButton.disabled=false;
  donateButton.textContent='Choose custom amount';
});
donateButton.addEventListener('click',()=>{
  const url=STRIPE_LINKS[selectedAmount];
  if(!url||url.startsWith('PASTE_')){
    alert('The Stripe payment link for this option has not been added yet.');
    return;
  }
  window.location.href=url;
});
</script>
</body>
</html>
